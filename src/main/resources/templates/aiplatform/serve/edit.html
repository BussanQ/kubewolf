<!DOCTYPE html>
<html lang="zh">
#@header("修改服务")
<body>
<form class="layui-form" lay-filter="editor">
    <input type="hidden" name="taskId">
    <div class="mainBox">
        <div class="main-container layui-row layui-col-space20">
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label" for="taskName">服务名称</label>
                    <div class="layui-input-block">
                        <input class="layui-input" id="taskName" name="taskName" readonly>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label" for="type">类型</label>
                    <div class="layui-input-block">
                        <select id="type" name="type"><option value="run">自定义服务</option><option value="vllm">vLLM</option><option value="sglang">SGLang</option></select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label" for="image">镜像</label>
                    <div class="layui-input-block">
                        <input class="layui-input" id="image" name="image" required lay-verify="required" placeholder="请输入镜像地址">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label" for="replicas">实例数量</label>
                    <div class="layui-input-block">
                        <input class="layui-input" type="number" id="replicas" name="replicas" min="1" max="100" required>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label" for="port">端口</label>
                    <div class="layui-input-block">
                        <input class="layui-input" type="number" id="port" name="port" min="1" max="65535" required>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label" for="modelCode">模型 PVC</label>
                    <div class="layui-input-block">
                        <input class="layui-input" id="modelCode" name="modelCode" placeholder="模型文件所在的 PVC 名称">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label" for="modelPath">挂载路径</label>
                    <div class="layui-input-block">
                        <input class="layui-input" id="modelPath" name="modelPath" placeholder="例如 /model">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label" for="cpu">CPU 毫核</label>
                    <div class="layui-input-block">
                        <input class="layui-input" type="number" id="cpu" name="cpu" min="1" required>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label" for="mem">内存 MiB</label>
                    <div class="layui-input-block">
                        <input class="layui-input" type="number" id="mem" name="mem" min="1" required>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label" for="gpu">GPU 数量</label>
                    <div class="layui-input-block">
                        <input class="layui-input" type="number" id="gpu" name="gpu" min="0" required>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label" for="gpuResource">GPU 资源</label>
                    <div class="layui-input-block">
                        <input class="layui-input" id="gpuResource" name="gpuResource" placeholder="nvidia.com/gpu">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label" for="cmd">启动命令</label>
                    <div class="layui-input-block">
                        <textarea class="layui-textarea" id="cmd" name="cmd" maxlength="1000" placeholder="请输入启动命令"></textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label" for="env">环境变量</label>
                    <div class="layui-input-block">
                        <textarea class="layui-textarea" id="env" name="env" maxlength="1000" placeholder="NAME:value;NAME2:value"></textarea>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit lay-filter="save">
                <i class="layui-icon layui-icon-ok"></i> 保存
            </button>
            <button type="button" id="cancel" class="layui-btn layui-btn-primary layui-btn-sm">
                <i class="layui-icon layui-icon-close"></i> 取消
            </button>
        </div>
    </div>
</form>
#@footer()
<script>
layui.use(['form','jquery','layer'], function () {
const form = layui.form, $ = layui.jquery, layer = layui.layer;
$('#cancel').on('click', function () { parent.layer.close(parent.layer.getFrameIndex(window.name)); });
const taskId=new URLSearchParams(location.search).get('taskId');
$.getJSON('/api/v1/serve/get',{taskId:taskId}).done(function(res){form.val('editor',res.data);});
form.on('submit(save)',function(data){
    ['replicas','port','cpu','mem','gpu'].forEach(function(k){data.field[k]=Number(data.field[k]);});
    $.ajax({url:'/api/v1/serve/update',type:'POST',contentType:'application/json',data:JSON.stringify(data.field)})
      .done(function(){parent.layui.table.reload('management-table');parent.layer.close(parent.layer.getFrameIndex(window.name));});
    return false;
});
});
</script>
</body>
</html>
