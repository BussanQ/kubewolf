<!DOCTYPE html><html lang="zh"><head>#@header("修改服务")</head>
<body class="pear-container"><form class="layui-form" lay-filter="editor" style="padding:20px">
<input type="hidden" name="taskId">
<label>服务名称</label><input class="layui-input" name="taskName" readonly>
<label>类型</label><select name="type"><option value="run">自定义服务</option><option value="vllm">vLLM</option><option value="sglang">SGLang</option></select>
<label>镜像</label><input class="layui-input" name="image" required lay-verify="required">
<label>实例数量</label><input class="layui-input" type="number" name="replicas" min="1" max="100" required>
<label>端口</label><input class="layui-input" type="number" name="port" min="1" max="65535" required>
<label>CPU（毫核）</label><input class="layui-input" type="number" name="cpu" min="1" required>
<label>内存（MiB）</label><input class="layui-input" type="number" name="mem" min="1" required>
<label>GPU 数量</label><input class="layui-input" type="number" name="gpu" min="0" required>
<label>GPU 资源名称</label><input class="layui-input" name="gpuResource">
<label>模型 PVC</label><input class="layui-input" name="modelCode">
<label>模型挂载路径</label><input class="layui-input" name="modelPath">
<label>启动命令</label><textarea class="layui-textarea" name="cmd" maxlength="1000"></textarea>
<label>环境变量</label><textarea class="layui-textarea" name="env" maxlength="1000"></textarea>
<button class="layui-btn" style="margin-top:16px" lay-submit lay-filter="save">保存</button>
</form>#@footer()<script>
layui.use(['form','jquery','layer'], function () {
const form = layui.form, $ = layui.jquery, layer = layui.layer;
const taskId=new URLSearchParams(location.search).get('taskId');
$.getJSON('/api/v1/serve/get',{taskId:taskId}).done(function(res){form.val('editor',res.data);});
form.on('submit(save)',function(data){
    ['replicas','port','cpu','mem','gpu'].forEach(function(k){data.field[k]=Number(data.field[k]);});
    $.ajax({url:'/api/v1/serve/update',type:'POST',contentType:'application/json',data:JSON.stringify(data.field)})
      .done(function(){parent.layui.table.reload('management-table');parent.layer.close(parent.layer.getFrameIndex(window.name));});
    return false;
});
});
</script></body></html>
