<!DOCTYPE html>
<html lang="zh">
#@header("部署模型")
<body>
<form class="layui-form" lay-filter="editor">

    <div class="mainBox">
        <div class="main-container layui-row layui-col-space20">
            <div class="layui-col-xs12">
                <div class="layui-form-item">
                    <label class="layui-form-label" for="taskName">服务名称</label>
                    <div class="layui-input-block">
                        <input class="layui-input" id="taskName" name="taskName" required lay-verify="required" placeholder="小写字母、数字和连字符" maxlength="63">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label" for="model-search">搜索模型</label>
                    <div class="layui-input-block">
                        <div class="layui-row layui-col-space10">
                            <div class="layui-col-xs9"><input id="model-search" class="layui-input" placeholder="输入模型名称"></div>
                            <div class="layui-col-xs3"><button type="button" id="search-model" class="layui-btn layui-btn-normal layui-btn-fluid">搜索</button></div>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label" for="model-select">模型</label>
                    <div class="layui-input-block">
                        <select id="model-select" name="modelId" lay-verify="required"></select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label" for="type">推理框架</label>
                    <div class="layui-input-block">
                        <select id="type" name="type"><option value="vllm">vLLM</option><option value="sglang">SGLang</option></select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label" for="replicas">实例数量</label>
                    <div class="layui-input-block">
                        <input class="layui-input" type="number" id="replicas" name="replicas" min="1" max="100" value="1" required>
                    </div>
                </div>
            </div>
            <div class="layui-col-xs12">
                <div class="layui-form-item"><div class="layui-input-block layui-word-aux">模型需要已创建的 PVC 和可用 GPU。部署结果及失败原因可在服务列表查看。</div></div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit lay-filter="save">
                <i class="layui-icon layui-icon-ok"></i> 保存
            </button>
            <button type="button" id="cancel" class="layui-btn layui-btn-primary layui-btn-sm">
                <i class="layui-icon layui-icon-close"></i> 取消
            </button>
        </div>
    </div>
</form>
#@footer()
<script>
layui.use(['form','jquery','layer'], function () {
const form = layui.form, $ = layui.jquery, layer = layui.layer;
$('#cancel').on('click', function () { parent.layer.close(parent.layer.getFrameIndex(window.name)); });
const selected = new URLSearchParams(location.search).get('modelId');
function addOption(model) { $('#model-select').append($('<option>').val(model.id).text(model.name)); }
function loadModels() {
    $.getJSON('/api/v1/models/list',{pageNum:1,pageSize:100,name:$('#model-search').val()}).done(function(res) {
        $('#model-select').empty(); res.data.forEach(addOption);
        if(selected && !res.data.some(function(m){return m.id===selected;})) {
            $.getJSON('/api/v1/models/get',{id:selected}).done(function(r){addOption(r.data);$('#model-select').val(selected);form.render('select');});
        } else { if(selected) $('#model-select').val(selected);form.render('select'); }
    });
}
$('#search-model').on('click',loadModels); loadModels();
form.on('submit(save)',function(data){
    data.field.replicas=Number(data.field.replicas);
    $.ajax({url:'/api/v1/serve/startModel',type:'POST',contentType:'application/json',data:JSON.stringify(data.field)})
      .done(function(){parent.layui.table.reload('management-table');parent.layer.close(parent.layer.getFrameIndex(window.name));});
    return false;
});
});
</script>
</body>
</html>
