<!DOCTYPE html>
<html lang="zh" >
#@header("新增训练任务")
<body>
<form class="layui-form" onsubmit="return false;">
    <div class="mainBox">
        <div class="main-container layui-row">
            <blockquote class="layui-elem-quote" role="status">
                训练功能尚未实现。当前页面仅供配置预览，暂不支持创建、保存或运行训练任务。
            </blockquote>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">任务名称：</label>
                    <div class="layui-input-block">
                        <input type="text" name="jobName" lay-verify="required" placeholder="请输入任务名称" class="layui-input" lay-required/>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">训练类型：</label>
                    <div class="layui-input-block">
                        <select name="jobType" lay-required>
                            <option value=""></option>
                            <option value="TFJob">TFJob</option>
                            <option value="PyTorchJob">PyTorchJob</option>
<!--                            <option value="mpijob">mpijob</option>-->
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">训练镜像：</label>
                    <div class="layui-input-block">
                       <!-- <select name="images" lay-required>
                            <option value=""></option>
                            <option value="0">tensorflow/tensorflow:1.11.0-gpu-py3</option>
                            <option value="1">pythoch:1.0</option>
                            <option value="2">mpi:1.0</option>
                        </select>-->
                        <input type="text" name="image" lay-verify="required" placeholder="请输入镜像名称" class="layui-input" lay-required/>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">代码git：</label>
                    <div class="layui-input-block">
                        <input type="text" name="testcode" placeholder="请输入代码git地址" class="layui-input"/>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">数据集：</label>
                    <div class="layui-input-block">
                         <select name="testdata" lay-required>
                             <option value=""></option>
                             <option value="imagenetf">imagenetf</option>
                         </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">日志目录：</label>
                    <div class="layui-input-block">
                        <input type="text" name="logDir" placeholder="请输入日志目录" class="layui-input"/>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">节点数量：</label>
                    <div class="layui-input-block">
                        <input type="text" name="nodeCount" placeholder="请输入节点数量" class="layui-input"/>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">GPU数量：</label>
                    <div class="layui-input-block">
                        <input type="text" name="gpuCount" placeholder="请输入GPU数量" class="layui-input"/>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">启动命令：</label>
                    <div class="layui-input-block">
                        <textarea name="commandExec" placeholder="请输入启动命令" class="layui-textarea"></textarea>
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
            <!--
                <div class="layui-form-item">
                    <label class="layui-form-label">启动参数：</label>
                    <div class="layui-input-block">
                        <input type="text" name="args" placeholder="请输入启动参数" class="layui-input"/>
                    </div>
                </div>
                -->
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="button" class="layui-btn layui-btn-disabled layui-btn-sm" disabled title="训练功能尚未实现">
                <i class="layui-icon layui-icon-ok"></i>
                提交（暂不可用）
            </button>
            <button type="button" id="close-dialog" class="layui-btn layui-btn-primary layui-btn-sm">
                <i class="layui-icon layui-icon-close"></i>
                关闭
            </button>
        </div>
    </div>
</form>
#@footer()
<script>
    layui.use(['form', 'jquery'], function () {
        layui.jquery('#close-dialog').on('click', function () {
            parent.layer.close(parent.layer.getFrameIndex(window.name));
        });
    });
</script>
</body>
</html>
