<!DOCTYPE html><html lang="zh"><head>#@header("模型配置")</head>
<body class="pear-container"><form class="layui-form" lay-filter="editor" style="padding:20px">
<input type="hidden" name="id">
<label>模型名称</label><input class="layui-input" name="name" maxlength="255" required lay-verify="required">
<label>PVC 名称</label><input class="layui-input" name="code" maxlength="63" required lay-verify="required" placeholder="模型文件所在的 PVC 名称">
<label>容器挂载路径</label><input class="layui-input" name="modelPath" value="/model" readonly>
<label>推理框架</label><select name="type"><option value="vllm">vLLM</option><option value="sglang">SGLang</option></select>
<label>环境变量</label><textarea class="layui-textarea" name="env" maxlength="1000" placeholder="NAME:value;NAME2:value"></textarea>
<label>备注</label><textarea class="layui-textarea" name="custom" maxlength="1000"></textarea>
<button class="layui-btn" style="margin-top:16px" lay-submit lay-filter="save">保存</button>
</form>#@footer()<script>
layui.use(['form','jquery','layer'], function () {
const form = layui.form, $ = layui.jquery, layer = layui.layer;
const id = new URLSearchParams(location.search).get('id');
if (id) $.getJSON('/api/v1/models/get', {id:id}).done(function(res) { form.val('editor',res.data); });
form.on('submit(save)', function(data) {
    $.ajax({url:'/api/v1/models/'+(id?'update':'create'),type:'POST',contentType:'application/json',data:JSON.stringify(data.field)})
      .done(function() { parent.layui.table.reload('management-table'); parent.layer.close(parent.layer.getFrameIndex(window.name)); });
    return false;
});
});
</script></body></html>
